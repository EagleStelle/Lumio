<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumio</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-dark text-light d-flex align-items-center justify-content-center min-vh-100"
  >
    <main class="container">
      <div class="row justify-content-center">
        <div class="col-11 col-md-8 col-lg-6">
          <div class="card bg-black shadow-lg text-center" id="resultsCard">
            <div class="card-body py-5">
              <h1 class="display-6 fw-bold mb-3" id="resultsTitle">
                Game Over
              </h1>

              <div class="fs-2 fw-bold mb-2" id="scoreDisplay">
                <span id="finalScore">0</span
                ><span id="scoreSuffix"> / 10</span>
              </div>

              <p class="mb-4" id="scoreMessage">Nice try.</p>

              <div class="d-flex justify-content-center gap-2">
                <a href="game-easy.html" class="btn" id="playAgainLink">
                  Play Again
                </a>
                <a href="index.html" class="btn btn-outline-light">Title</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      const score = Number(sessionStorage.getItem("lightbulbScore") || 0);
      const lastPage =
        sessionStorage.getItem("lightbulbLastPage") || "game-easy.html";
      const mode = sessionStorage.getItem("lightbulbMode") || "easy";
      const endless = sessionStorage.getItem("lightbulbEndless") === "1";

      const resultsCard = document.getElementById("resultsCard");
      const scoreDisplay = document.getElementById("scoreDisplay");
      const playAgainLink = document.getElementById("playAgainLink");
      const scoreSuffix = document.getElementById("scoreSuffix");
      const resultsTitle = document.getElementById("resultsTitle");
      const scoreMessage = document.getElementById("scoreMessage");

      document.getElementById("finalScore").textContent = score;

      if (endless) {
        scoreSuffix.textContent = "";
        resultsTitle.textContent = "Endless Over";
        playAgainLink.href = `${lastPage}?mode=${mode}&endless=1`;
      } else {
        scoreSuffix.textContent = " / 10";
        resultsTitle.textContent = "Game Over";
        playAgainLink.href = `${lastPage}?mode=${mode}`;
      }

      let borderClass = "border-success";
      let textClass = "text-success";
      let buttonClass = "btn-success";

      if (mode === "normal") {
        borderClass = "border-info";
        textClass = "text-info";
        buttonClass = "btn-info";
      } else if (mode === "hard") {
        borderClass = "border-warning";
        textClass = "text-warning";
        buttonClass = "btn-warning";
      } else if (mode === "extreme") {
        borderClass = "border-danger";
        textClass = "text-danger";
        buttonClass = "btn-danger";
      }

      resultsCard.classList.add(borderClass);
      scoreDisplay.classList.add(textClass);
      playAgainLink.classList.add(buttonClass);

      let message = "Nice try.";

      if (endless) {
        if (score >= 50) {
          message =
            "Legendary run. You kept the circuit alive for a long time.";
        } else if (score >= 35) {
          message = "Amazing survival. The pressure barely slowed you down.";
        } else if (score >= 25) {
          message = "Strong run. You handled the rising pressure well.";
        } else if (score >= 15) {
          message = "Solid survival. You were holding on well.";
        } else if (score >= 8) {
          message = "Good effort. You lasted a while in endless mode.";
        } else if (score >= 4) {
          message = "A decent start. Endless gets brutal fast.";
        } else {
          message =
            "Endless is unforgiving. Flip the lever and try another run.";
        }
      } else {
        if (score === 10) {
          message = "Perfect score.";
        } else if (score >= 8) {
          message = "Excellent job.";
        } else if (score >= 6) {
          message = "Good work.";
        } else if (score >= 4) {
          message = "Not bad.";
        } else {
          message = "Try again and beat your score.";
        }
      }

      scoreMessage.textContent = message;
    </script>
  </body>
</html>
