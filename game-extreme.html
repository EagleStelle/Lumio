<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumio</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
  </head>
  <body
    data-mode="extreme"
    class="bg-dark text-light d-flex align-items-center justify-content-center min-vh-100"
  >
    <main class="container-fluid py-2">
      <div class="row justify-content-center">
        <div class="col-12 col-xl-9">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div class="d-flex align-items-center gap-2">
              <span class="badge bg-danger px-3 py-2 fs-6 shadow-sm">
                Extreme Mode
              </span>
              <button
                type="button"
                class="btn btn-outline-light btn-sm"
                id="fullscreenButton"
                aria-label="Toggle fullscreen"
                title="Fullscreen"
                onclick="
                  if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen?.();
                  } else {
                    document.exitFullscreen?.();
                  }
                "
              >
                <i class="bi bi-fullscreen"></i>
              </button>
            </div>
            <div>
              <span class="badge bg-danger me-2">
                Round <span id="roundNumber">1</span>
              </span>
              <span class="badge bg-secondary">
                Score <span id="score">0</span>
              </span>
            </div>
          </div>

          <div id="timerWrap" class="mb-2 d-none" aria-label="Endless meter">
            <div
              class="progress"
              style="height: 8px"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="100"
            >
              <div
                id="timerBar"
                class="progress-bar bg-success"
                style="width: 100%"
              ></div>
            </div>
          </div>

          <div class="mb-2">
            <div class="row g-2">
              <div class="col-12">
                <div class="card bg-black border-secondary text-center">
                  <div
                    class="card-body py-2 px-2 h-100 d-flex flex-column align-items-center justify-content-center text-center"
                  >
                    <div class="text-secondary small">Final Gate</div>
                    <div class="fw-bold fs-4" id="gateName4">NOR</div>
                    <div class="text-secondary small">Branch + E</div>

                    <svg
                      id="bulbSvg"
                      width="90"
                      height="118"
                      viewBox="0 0 140 180"
                      aria-label="Main lightbulb"
                      role="img"
                    >
                      <path
                        id="bulbGlow"
                        d="M70 15 C42 15 20 37 20 65 C20 82 28 95 38 106 C47 116 52 126 52 136 H88 C88 126 93 116 102 106 C112 95 120 82 120 65 C120 37 98 15 70 15 Z"
                        fill="#343a40"
                        stroke="#6c757d"
                        stroke-width="4"
                      />
                      <rect
                        x="52"
                        y="136"
                        width="36"
                        height="14"
                        rx="4"
                        fill="#6c757d"
                      ></rect>
                      <rect
                        x="54"
                        y="150"
                        width="32"
                        height="10"
                        rx="3"
                        fill="#6c757d"
                      ></rect>
                      <rect
                        x="56"
                        y="160"
                        width="28"
                        height="10"
                        rx="3"
                        fill="#6c757d"
                      ></rect>
                    </svg>
                    <div id="bulbStatus" class="small text-secondary mt-1">
                      Waiting for submission
                    </div>
                  </div>
                </div>
              </div>
              <div class="col-12">
                <div
                  class="row g-2 align-items-md-stretch"
                  id="extremeLayoutRow"
                >
                  <div class="col-8 col-md-8 d-flex">
                    <div
                      class="card bg-dark-subtle border-secondary h-100 w-100"
                    >
                      <div class="py-2 px-2 h-100 d-flex flex-column">
                        <div class="text-secondary small text-center mb-2">
                          Branch = ((A+B)+(C+D))
                        </div>
                        <div
                          class="row row-cols-1 row-cols-sm-2 g-2 flex-grow-1 align-items-md-stretch"
                        >
                          <div class="col d-flex">
                            <div
                              id="gate1Card"
                              class="card bg-black border-secondary h-100 w-100"
                            >
                              <div
                                class="card-body py-2 px-2 h-100 d-flex align-items-center justify-content-center"
                              >
                                <div
                                  id="gate1Inner"
                                  class="d-flex flex-row align-items-center justify-content-center text-center gap-2"
                                >
                                  <svg
                                    width="42"
                                    height="54"
                                    viewBox="0 0 140 180"
                                    aria-label="Gate 1 output bulb"
                                    role="img"
                                  >
                                    <path
                                      id="miniBulbGlow1"
                                      d="M70 15 C42 15 20 37 20 65 C20 82 28 95 38 106 C47 116 52 126 52 136 H88 C88 126 93 116 102 106 C112 95 120 82 120 65 C120 37 98 15 70 15 Z"
                                      fill="#343a40"
                                      stroke="#6c757d"
                                      stroke-width="4"
                                    />
                                    <rect
                                      x="52"
                                      y="136"
                                      width="36"
                                      height="14"
                                      rx="4"
                                      fill="#6c757d"
                                    ></rect>
                                    <rect
                                      x="54"
                                      y="150"
                                      width="32"
                                      height="10"
                                      rx="3"
                                      fill="#6c757d"
                                    ></rect>
                                    <rect
                                      x="56"
                                      y="160"
                                      width="28"
                                      height="10"
                                      rx="3"
                                      fill="#6c757d"
                                    ></rect>
                                  </svg>
                                  <div>
                                    <div class="text-secondary small">
                                      Gate 1
                                    </div>
                                    <div class="fw-bold" id="gateName1">
                                      AND
                                    </div>
                                    <div
                                      class="text-secondary small"
                                      id="gate1ExpressionLabel"
                                    >
                                      ( A + B )
                                    </div>
                                  </div>
                                </div>
                              </div>
                            </div>
                          </div>

                          <div class="col d-flex">
                            <div
                              id="gate2Card"
                              class="card bg-black border-secondary h-100 w-100"
                            >
                              <div
                                class="card-body py-2 px-2 h-100 d-flex align-items-center justify-content-center"
                              >
                                <div
                                  id="gate2Inner"
                                  class="d-flex flex-row align-items-center justify-content-center text-center gap-2"
                                >
                                  <svg
                                    width="42"
                                    height="54"
                                    viewBox="0 0 140 180"
                                    aria-label="Gate 2 output bulb"
                                    role="img"
                                  >
                                    <path
                                      id="miniBulbGlow2"
                                      d="M70 15 C42 15 20 37 20 65 C20 82 28 95 38 106 C47 116 52 126 52 136 H88 C88 126 93 116 102 106 C112 95 120 82 120 65 C120 37 98 15 70 15 Z"
                                      fill="#343a40"
                                      stroke="#6c757d"
                                      stroke-width="4"
                                    />
                                    <rect
                                      x="52"
                                      y="136"
                                      width="36"
                                      height="14"
                                      rx="4"
                                      fill="#6c757d"
                                    ></rect>
                                    <rect
                                      x="54"
                                      y="150"
                                      width="32"
                                      height="10"
                                      rx="3"
                                      fill="#6c757d"
                                    ></rect>
                                    <rect
                                      x="56"
                                      y="160"
                                      width="28"
                                      height="10"
                                      rx="3"
                                      fill="#6c757d"
                                    ></rect>
                                  </svg>
                                  <div>
                                    <div class="text-secondary small">
                                      Gate 2
                                    </div>
                                    <div class="fw-bold" id="gateName2">OR</div>
                                    <div
                                      class="text-secondary small"
                                      id="gate2ExpressionLabel"
                                    >
                                      ( C + D )
                                    </div>
                                  </div>
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="col-4 col-md-4 d-flex">
                    <div class="h-100 w-100 d-flex">
                      <div
                        id="gate3Card"
                        class="card bg-black border-secondary h-100 w-100"
                      >
                        <div
                          class="card-body py-2 px-2 h-100 d-flex align-items-center justify-content-center"
                        >
                          <div
                            id="gate3Inner"
                            class="d-flex flex-column align-items-center justify-content-center text-center gap-2"
                          >
                            <svg
                              width="42"
                              height="54"
                              viewBox="0 0 140 180"
                              aria-label="Gate 3 output bulb"
                              role="img"
                            >
                              <path
                                id="miniBulbGlow3"
                                d="M70 15 C42 15 20 37 20 65 C20 82 28 95 38 106 C47 116 52 126 52 136 H88 C88 126 93 116 102 106 C112 95 120 82 120 65 C120 37 98 15 70 15 Z"
                                fill="#343a40"
                                stroke="#6c757d"
                                stroke-width="4"
                              />
                              <rect
                                x="52"
                                y="136"
                                width="36"
                                height="14"
                                rx="4"
                                fill="#6c757d"
                              ></rect>
                              <rect
                                x="54"
                                y="150"
                                width="32"
                                height="10"
                                rx="3"
                                fill="#6c757d"
                              ></rect>
                              <rect
                                x="56"
                                y="160"
                                width="28"
                                height="10"
                                rx="3"
                                fill="#6c757d"
                              ></rect>
                            </svg>
                            <div>
                              <div class="text-secondary small">Gate 3</div>
                              <div class="fw-bold" id="gateName3">XOR</div>
                              <div
                                class="text-secondary small"
                                id="gate3ExpressionLabel"
                              >
                                Branch
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div
            class="row row-cols-5 g-2 justify-content-center mb-2 align-items-stretch"
          >
            <div class="col">
              <div class="card bg-black border-secondary text-center h-100">
                <div class="card-body p-2">
                  <div class="fw-semibold small mb-1">A</div>
                  <input type="checkbox" id="switchA" hidden />
                  <label for="switchA" class="mb-0" role="button">
                    <svg
                      width="42"
                      height="56"
                      viewBox="0 0 100 120"
                      aria-label="Lever A"
                    >
                      <rect
                        x="20"
                        y="80"
                        width="60"
                        height="25"
                        rx="6"
                        fill="#343a40"
                      />
                      <circle cx="50" cy="80" r="6" fill="#6c757d" />
                      <g id="leverA" transform="rotate(-35 50 80)">
                        <rect
                          x="47"
                          y="38"
                          width="6"
                          height="42"
                          rx="3"
                          fill="#adb5bd"
                        />
                        <circle
                          cx="50"
                          cy="38"
                          r="9"
                          fill="#dee2e6"
                          stroke="#6c757d"
                          stroke-width="2"
                        />
                      </g>
                    </svg>
                  </label>
                  <div class="mt-1">
                    <strong id="switchALabel" class="text-secondary small"
                      >OFF</strong
                    >
                  </div>
                </div>
              </div>
            </div>
            <div class="col">
              <div class="card bg-black border-secondary text-center h-100">
                <div class="card-body p-2">
                  <div class="fw-semibold small mb-1">B</div>
                  <input type="checkbox" id="switchB" hidden />
                  <label for="switchB" class="mb-0" role="button">
                    <svg
                      width="42"
                      height="56"
                      viewBox="0 0 100 120"
                      aria-label="Lever B"
                    >
                      <rect
                        x="20"
                        y="80"
                        width="60"
                        height="25"
                        rx="6"
                        fill="#343a40"
                      />
                      <circle cx="50" cy="80" r="6" fill="#6c757d" />
                      <g id="leverB" transform="rotate(-35 50 80)">
                        <rect
                          x="47"
                          y="38"
                          width="6"
                          height="42"
                          rx="3"
                          fill="#adb5bd"
                        />
                        <circle
                          cx="50"
                          cy="38"
                          r="9"
                          fill="#dee2e6"
                          stroke="#6c757d"
                          stroke-width="2"
                        />
                      </g>
                    </svg>
                  </label>
                  <div class="mt-1">
                    <strong id="switchBLabel" class="text-secondary small"
                      >OFF</strong
                    >
                  </div>
                </div>
              </div>
            </div>
            <div class="col">
              <div class="card bg-black border-secondary text-center h-100">
                <div class="card-body p-2">
                  <div class="fw-semibold small mb-1">C</div>
                  <input type="checkbox" id="switchC" hidden />
                  <label for="switchC" class="mb-0" role="button">
                    <svg
                      width="42"
                      height="56"
                      viewBox="0 0 100 120"
                      aria-label="Lever C"
                    >
                      <rect
                        x="20"
                        y="80"
                        width="60"
                        height="25"
                        rx="6"
                        fill="#343a40"
                      />
                      <circle cx="50" cy="80" r="6" fill="#6c757d" />
                      <g id="leverC" transform="rotate(-35 50 80)">
                        <rect
                          x="47"
                          y="38"
                          width="6"
                          height="42"
                          rx="3"
                          fill="#adb5bd"
                        />
                        <circle
                          cx="50"
                          cy="38"
                          r="9"
                          fill="#dee2e6"
                          stroke="#6c757d"
                          stroke-width="2"
                        />
                      </g>
                    </svg>
                  </label>
                  <div class="mt-1">
                    <strong id="switchCLabel" class="text-secondary small"
                      >OFF</strong
                    >
                  </div>
                </div>
              </div>
            </div>
            <div class="col">
              <div class="card bg-black border-secondary text-center h-100">
                <div class="card-body p-2">
                  <div class="fw-semibold small mb-1">D</div>
                  <input type="checkbox" id="switchD" hidden />
                  <label for="switchD" class="mb-0" role="button">
                    <svg
                      width="42"
                      height="56"
                      viewBox="0 0 100 120"
                      aria-label="Lever D"
                    >
                      <rect
                        x="20"
                        y="80"
                        width="60"
                        height="25"
                        rx="6"
                        fill="#343a40"
                      />
                      <circle cx="50" cy="80" r="6" fill="#6c757d" />
                      <g id="leverD" transform="rotate(-35 50 80)">
                        <rect
                          x="47"
                          y="38"
                          width="6"
                          height="42"
                          rx="3"
                          fill="#adb5bd"
                        />
                        <circle
                          cx="50"
                          cy="38"
                          r="9"
                          fill="#dee2e6"
                          stroke="#6c757d"
                          stroke-width="2"
                        />
                      </g>
                    </svg>
                  </label>
                  <div class="mt-1">
                    <strong id="switchDLabel" class="text-secondary small"
                      >OFF</strong
                    >
                  </div>
                </div>
              </div>
            </div>
            <div class="col">
              <div class="card bg-black border-secondary text-center h-100">
                <div class="card-body p-2">
                  <div class="fw-semibold small mb-1">E</div>
                  <input type="checkbox" id="switchE" hidden />
                  <label for="switchE" class="mb-0" role="button">
                    <svg
                      width="42"
                      height="56"
                      viewBox="0 0 100 120"
                      aria-label="Lever E"
                    >
                      <rect
                        x="20"
                        y="80"
                        width="60"
                        height="25"
                        rx="6"
                        fill="#343a40"
                      />
                      <circle cx="50" cy="80" r="6" fill="#6c757d" />
                      <g id="leverE" transform="rotate(-35 50 80)">
                        <rect
                          x="47"
                          y="38"
                          width="6"
                          height="42"
                          rx="3"
                          fill="#adb5bd"
                        />
                        <circle
                          cx="50"
                          cy="38"
                          r="9"
                          fill="#dee2e6"
                          stroke="#6c757d"
                          stroke-width="2"
                        />
                      </g>
                    </svg>
                  </label>
                  <div class="mt-1">
                    <strong id="switchELabel" class="text-secondary small"
                      >OFF</strong
                    >
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="d-grid mt-2">
            <button
              class="btn btn-danger btn-lg"
              id="submitButton"
              type="button"
            >
              Submit
            </button>
          </div>
          <div class="card bg-dark border-secondary mt-2 d-none d-md-block">
            <div class="card-body py-2">
              <div class="text-secondary small text-center mb-1 fw-semibold">
                Keyboard Controls
              </div>
              <div class="d-flex justify-content-center flex-wrap gap-2 small">
                <span class="badge bg-secondary">1</span>
                <span class="text-secondary">A</span>
                <span class="badge bg-secondary">2</span>
                <span class="text-secondary">B</span>
                <span class="badge bg-secondary">3</span>
                <span class="text-secondary">C</span>
                <span class="badge bg-secondary">4</span>
                <span class="text-secondary">D</span>
                <span class="badge bg-secondary">5</span>
                <span class="text-secondary">E</span>
                <span class="badge bg-danger">Enter</span>
                <span class="text-secondary">Submit</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div
        id="comboPopup"
        class="position-fixed top-0 start-50 translate-middle-x mt-3 px-3 py-2 rounded-pill bg-danger text-white fw-bold shadow d-none"
        style="z-index: 1080; pointer-events: none"
        aria-live="polite"
      >
        5 Combo
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="script.js"></script>
  </body>
</html>
