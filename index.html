<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>

    <title>Lumio</title>

  <body class="bg-dark text-light d-flex align-items-center min-vh-100">

          <div class="card bg-black border-secondary shadow-sm">

                  height="220"

                  />

                    x="52"
                    y="136"
                    width="36"
                    height="14"
                    rx="4"
                    fill="#6c757d"
                  ></rect>
                  <rect
                    x="54"
                    y="150"
                    width="32"
                    height="10"
                    rx="3"
                    fill="#6c757d"
                  ></rect>
                  <rect
                    x="56"
                    y="160"
                    width="28"
                    height="10"
                    rx="3"
                    fill="#6c757d"
                  ></rect>

              </div>

              <h1 class="display-4 fw-bold mb-3">Lumio</h1>
              <p class="lead text-secondary mb-4">

              </p>
              <a href="mode.html" class="btn btn-warning btn-lg px-4">Start</a>
            </div>
          </div>
        </div>
      </div>

</html>
